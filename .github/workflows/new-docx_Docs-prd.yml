# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - Docs-prd

on:
  push:
    branches:
      - new-docx
  workflow_dispatch:

jobs:
  build:
    runs-on: 'ubuntu-latest'

    steps:
    - uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to registry
      uses: docker/login-action@v2
      with:
        registry: https://nbold.azurecr.io/
        username: ${{ secrets.AzureAppService_ContainerUsername_bf1f74d5cf144cf4bd9ab2cae0ecdc85 }}
        password: ${{ secrets.AzureAppService_ContainerPassword_caa8dabfc2424fb993b8904f6e7c248b }}

    - name: Build and push container image to registry
      uses: docker/build-push-action@v3
      with:
        push: true
        tags: nbold.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_bf1f74d5cf144cf4bd9ab2cae0ecdc85 }}/nbold/docs:${{ github.sha }}
        file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'Docs-prd'
        slot-name: 'production'
        publish-profile: ${{ secrets.AzureAppService_PublishProfile_ba319087acce49c8b8ed5dbc7ad4c14e }}
        images: 'nbold.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_bf1f74d5cf144cf4bd9ab2cae0ecdc85 }}/nbold/docs:${{ github.sha }}'