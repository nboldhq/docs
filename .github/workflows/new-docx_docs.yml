# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - docs

on:
  push:
    branches:
      - new-docx
  workflow_dispatch:

jobs:
  build:
    runs-on: 'ubuntu-latest'

    env: 
      VITE_API_ENDPOINT: ${{ secrets.VITE_API_ENDPOINT }}
      VITE_AZURE_CLIENT_ID: ${{ secrets.VITE_AZURE_CLIENT_ID }}
      VITE_AZURE_AUTHORITY: ${{ secrets.VITE_AZURE_AUTHORITY }}

    steps:
    - uses: actions/checkout@v2
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to registry
      uses: docker/login-action@v2
    - name: Build and push container image to registry
      uses: docker/build-push-action@v3
      with:
        push: true
        tags: nbold.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_099a2e9e7ea64e95800da198c4ced4fc }}/docs:prd
        file: ./Dockerfile
        build_args: |
          VITE_ALLOWED_HOST=${{ secrets.VITE_API_ENDPOINT }}
          VITE_AZURE_CLIENT_ID=${{ secrets.VITE_AZURE_CLIENT_ID }}
          VITE_AZURE_TENANT_ID=${{ secrets.VITE_AZURE_AUTHORITY }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'docs'
        slot-name: 'production'
        publish-profile: ${{ secrets.AzureAppService_PublishProfile_419fc483e6e944b39b50ccf8ad1ab7c1 }}
        images: 'nbold.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_099a2e9e7ea64e95800da198c4ced4fc }}/docs:prd'
